# Documentación OpenAPI de los endpoints de /api/routes.
# Los esquemas (Route, CreateRouteInput, ErrorResponse...) están en src/config/swagger.js.

/api/routes:
  get:
    summary: Listar todas las rutas
    description: Devuelve las rutas no eliminadas (soft delete), de la más reciente a la más antigua.
    tags: [Routes]
    responses:
      200:
        description: Lista de rutas
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Route'

  post:
    summary: Crear nueva ruta
    tags: [Routes]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRouteInput'
    responses:
      201:
        description: Ruta creada (slug, status, isActive, deletedAt y fechas se generan automáticamente)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
      400:
        description: Datos no válidos o JSON mal formado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      409:
        description: Ya existe una ruta con el slug generado (se comprueba antes de crear)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/routes/actives:
  get:
    summary: Listar rutas activas
    description: Devuelve solo las rutas con isActive true.
    tags: [Routes]
    responses:
      200:
        description: Lista de rutas activas
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Route'

/api/routes/deleted:
  get:
    summary: Listar rutas eliminadas
    description: Devuelve solo las rutas eliminadas (soft delete), de la eliminada más reciente a la más antigua. Es la única consulta que las incluye; sirve para mostrarlas y restaurarlas con PATCH /api/routes/{id}/restore.
    tags: [Routes]
    responses:
      200:
        description: Lista de rutas eliminadas
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Route'

/api/routes/inactives:
  get:
    summary: Listar rutas inactivas
    description: Devuelve solo las rutas con isActive false que no están eliminadas. Las eliminadas (soft delete) nunca aparecen.
    tags: [Routes]
    responses:
      200:
        description: Lista de rutas inactivas
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Route'

/api/routes/slug/{slug}:
  get:
    summary: Obtener ruta por slug
    tags: [Routes]
    parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
        description: Slug de la ruta
        example: costa-brava-loop-8b9c0d
    responses:
      200:
        description: Ruta encontrada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
      400:
        description: Slug con formato inválido
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      404:
        description: Ruta no encontrada o eliminada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/routes/{id}:
  get:
    summary: Obtener ruta por ID
    tags: [Routes]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: ID de la ruta
    responses:
      200:
        description: Ruta encontrada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
      400:
        description: ID inválido
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      404:
        description: Ruta no encontrada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  patch:
    summary: Actualizar ruta parcialmente
    tags: [Routes]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: ID de la ruta
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateRouteInput'
    responses:
      200:
        description: Ruta actualizada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
      400:
        description: ID inválido o datos no válidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      404:
        description: Ruta no encontrada o eliminada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/routes/{id}/active:
  patch:
    summary: Activar o desactivar una ruta
    description: Cambia isActive (y status a "active" o "inactive"). No afecta a deletedAt. Una ruta eliminada no se puede activar ni desactivar (404).
    tags: [Routes]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: ID de la ruta
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [isActive]
            properties:
              isActive:
                type: boolean
                example: false
    responses:
      200:
        description: Ruta actualizada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
      400:
        description: ID inválido o isActive ausente o no booleano
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      404:
        description: Ruta no encontrada o eliminada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/routes/{id}/delete:
  patch:
    summary: Eliminar ruta (soft delete)
    description: No borra el documento. Fija deletedAt, status "deleted" e isActive false; la ruta deja de aparecer en las consultas.
    tags: [Routes]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: ID de la ruta
    responses:
      204:
        description: Ruta eliminada
      400:
        description: ID inválido
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      404:
        description: Ruta no encontrada o ya eliminada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/routes/{id}/restore:
  patch:
    summary: Restaurar una ruta eliminada
    description: Pone deletedAt a null. La ruta vuelve inactiva salvo que se envíe isActive true. Solo actúa sobre rutas eliminadas.
    tags: [Routes]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: ID de la ruta
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              isActive:
                type: boolean
                description: Opcional. true restaura y activa; false o ausente la deja inactiva.
                example: true
    responses:
      200:
        description: Ruta restaurada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
      400:
        description: ID inválido o isActive no booleano
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      404:
        description: Ruta no encontrada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      409:
        description: La ruta no está eliminada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
