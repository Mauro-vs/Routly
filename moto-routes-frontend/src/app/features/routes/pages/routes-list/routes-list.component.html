<ui-list-page
  title="Rutas"
  icon="path"
  createPath="/routes/new"
  trashPath="/routes/trash"
  [labels]="store.labels"
  [loaded]="listLoaded()"
  [failed]="loadFailed()"
  [counts]="counts()"
  [total]="store.pageTotal()"
  [pageSize]="pageSize"
  [trashCount]="store.deletedCount()"
  [status]="store.status()"
  [(query)]="query"
  [sorts]="sorts"
  [(sort)]="sort"
  (statusChange)="setStatus($event)"
  [(page)]="page"
  (retry)="reload()"
>
  <ui-data-table
    caption="Rutas"
    [columns]="columns"
    [rows]="rows()"
    [rowKey]="rowKey"
    [mutedWhen]="isInactive"
    [loading]="showSkeleton()"
  >
    <ng-template uiCell="distance" [uiCellOf]="rows()" let-route>
      <span class="mark">
        <b class="slanted">{{ number(route.distance) }}</b>
        <span>km · {{ number(route.duration) }} h</span>
      </span>
    </ng-template>
    <ng-template uiCell="title" [uiCellOf]="rows()" let-route>
      <span class="cell-media">
        <ui-route-glyph [difficulty]="route.difficulty" />
        <span class="route">
          <a class="link cell-title" [routerLink]="['/routes', route.slug]" [title]="route.title">{{ route.title }}</a>
          <span class="trip">
            <ui-relation-link
              gender="f"
              [label]="route.startLocation?.city ?? null"
              [path]="route.startLocation ? ['/locations', route.startLocation.slug] : null"
            />
            <ui-icon name="arrow-right" />
            <ui-relation-link
              gender="f"
              [label]="route.endLocation?.city ?? null"
              [path]="route.endLocation ? ['/locations', route.endLocation.slug] : null"
            />
          </span>
        </span>
      </span>
    </ng-template>
    <ng-template uiCell="category" [uiCellOf]="rows()" let-route>
      <ui-relation-link
        gender="f"
        [label]="route.category?.name ?? null"
        [path]="route.category ? ['/categories', route.category.slug] : null"
      />
    </ng-template>
    <ng-template uiCell="difficulty" [uiCellOf]="rows()" let-route>
      <ui-level-meter [difficulty]="route.difficulty" />
    </ng-template>
    <ng-template uiCell="status" [uiCellOf]="rows()" let-route>
      <ui-status-toggle
        [active]="route.isActive"
        [label]="route.title"
        [labels]="store.labels"
        [busy]="store.isBusy(route._id)"
        (activeChange)="setActive(route, $event)"
      />
    </ng-template>
    <ng-template uiCell="actions" [uiCellOf]="rows()" let-route>
      <ui-row-actions
        [label]="route.title"
        [detailPath]="['/routes', route.slug]"
        [editPath]="['/routes', route.slug, 'edit']"
        [busy]="store.isBusy(route._id)"
        (remove)="remove(route)"
      />
    </ng-template>
  </ui-data-table>
</ui-list-page>
