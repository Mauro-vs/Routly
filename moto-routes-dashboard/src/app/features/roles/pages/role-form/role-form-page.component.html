<ui-form-page
  [heading]="heading()"
  [labels]="store.labels"
  [isEdit]="isEdit()"
  [loading]="loading()"
  [failed]="loadFailed()"
  [saving]="saving()"
  [cancelPath]="cancelPath()"
  [active]="isActive()"
  [lockedReason]="lockedReason()"
  (activeChange)="setActive($event)"
  (retry)="retry()"
>
  <app-role-form [record]="record()" (save)="save($event)" />
</ui-form-page>
