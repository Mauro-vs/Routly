<ui-list-page
  title="Motos"
  icon="motorcycle"
  createPath="/bikes/new"
  trashPath="/bikes/trash"
  [labels]="store.labels"
  [loaded]="listLoaded()"
  [refreshing]="refreshing()"
  [failed]="loadFailed()"
  [counts]="counts()"
  [total]="store.pageTotal()"
  [pageSize]="pageSize"
  [trashCount]="store.deletedCount()"
  [status]="store.status()"
  [(query)]="query"
  [sorts]="sorts"
  [(sort)]="sort"
  (statusChange)="setStatus($event)"
  [(page)]="page"
  (retry)="reload()"
>
  <ui-data-table
    caption="Motos"
    [columns]="columns"
    [rows]="rows()"
    [rowKey]="rowKey"
    [mutedWhen]="isInactive"
    [loading]="showSkeleton()"
  >
    <ng-template uiCell="bike" [uiCellOf]="rows()" let-bike>
      <span class="cell-media">
        <span class="thumb" aria-hidden="true">
          @if (bike.coverImage; as cover) {
            <img [src]="cover.url" alt="" loading="lazy" decoding="async" width="40" height="40" />
          } @else {
            <ui-icon name="motorcycle" />
          }
        </span>
        <span>
          <a class="link cell-title" [routerLink]="['/bikes', bike.slug]" [title]="name(bike)">{{ name(bike) }}</a>
          <span class="cell-sub">{{ typeLabels[bike.type] }}{{ bike.isPublic ? '' : ' · Privada' }}</span>
        </span>
      </span>
    </ng-template>
    <ng-template uiCell="owner" [uiCellOf]="rows()" let-bike>
      <ui-relation-link
        [label]="bike.user?.name ?? null"
        [path]="bike.user ? ['/users', bike.user.slug] : null"
      />
    </ng-template>
    <ng-template uiCell="specs" [uiCellOf]="rows()" let-bike>
      <span class="num nowrap">{{ specs(bike) }}</span>
    </ng-template>
    <ng-template uiCell="license" [uiCellOf]="rows()" let-bike>
      <b class="slanted">{{ bike.license }}</b>
    </ng-template>
    <ng-template uiCell="status" [uiCellOf]="rows()" let-bike>
      <ui-status-toggle
        [active]="bike.isActive"
        [label]="name(bike)"
        [labels]="store.labels"
        [busy]="store.isBusy(bike._id)"
        (activeChange)="setActive(bike, $event)"
      />
    </ng-template>
    <ng-template uiCell="actions" [uiCellOf]="rows()" let-bike>
      <ui-row-actions
        [label]="name(bike)"
        [detailPath]="['/bikes', bike.slug]"
        [editPath]="['/bikes', bike.slug, 'edit']"
        [busy]="store.isBusy(bike._id)"
        (remove)="remove(bike)"
      />
    </ng-template>
  </ui-data-table>
</ui-list-page>
