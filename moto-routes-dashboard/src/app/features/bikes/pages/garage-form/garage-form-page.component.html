<ui-form-page
  [heading]="heading()"
  [labels]="store.labels"
  [isEdit]="isEdit()"
  [loading]="loading()"
  [failed]="loadFailed()"
  [saving]="saving()"
  [cancelPath]="cancelPath()"
  [active]="isActive()"
  ownsImages
  (activeChange)="setActive($event)"
  (retry)="retry()"
>
  <app-bike-form [record]="record()" (save)="save($event)" />
  @if (record(); as owner) {
    <app-image-gallery
      ownerType="bike"
      [ownerId]="owner._id"
      [ownerLabel]="heading()"
      (coverChange)="refreshCover()"
    />
  }
</ui-form-page>
