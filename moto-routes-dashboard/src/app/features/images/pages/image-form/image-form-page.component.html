<ui-form-page
  [heading]="heading()"
  [labels]="store.labels"
  [isEdit]="true"
  [loading]="!record()"
  [failed]="loadFailed()"
  [saving]="store.saving()"
  [cancelPath]="detailPath()"
  [active]="record()?.isActive ?? true"
  (activeChange)="setActive($event)"
  (retry)="open()"
>
  <app-image-form [record]="record()" (save)="save($event)" />
</ui-form-page>
