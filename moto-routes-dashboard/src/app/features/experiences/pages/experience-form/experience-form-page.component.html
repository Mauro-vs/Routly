<ui-form-page
  [heading]="heading()"
  [labels]="store.labels"
  [isEdit]="isEdit()"
  [loading]="loading()"
  [failed]="loadFailed()"
  [saving]="saving()"
  [cancelPath]="cancelPath()"
  [active]="isActive()"
  ownsImages
  (activeChange)="setActive($event)"
  (retry)="retry()"
>
  <app-experience-form
    [record]="record()"
    [hosts]="store.hostOptions.items()"
    [routes]="store.routeOptions.items()"
    [optionsLoading]="optionsLoading()"
    [guideBikes]="store.guideBikes.items()"
    [guideBikesLoading]="store.guideBikes.loading()"
    (hostChange)="store.loadGuideBikes($event)"
    (save)="save($event)"
  />
  @if (record(); as owner) {
    <app-image-gallery
      ownerType="experience"
      [ownerId]="owner._id"
      [ownerLabel]="heading()"
      (coverChange)="refreshCover()"
    />
  }
</ui-form-page>
