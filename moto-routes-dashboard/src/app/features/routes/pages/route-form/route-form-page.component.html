<ui-form-page
  [heading]="heading()"
  [labels]="store.labels"
  [isEdit]="isEdit()"
  [loading]="loading()"
  [failed]="loadFailed()"
  [saving]="saving()"
  [cancelPath]="cancelPath()"
  [active]="isActive()"
  ownsImages
  (activeChange)="setActive($event)"
  (retry)="retry()"
>
  <app-route-form
    [record]="record()"
    [categories]="store.categoryOptions.items()"
    [locations]="store.locationOptions.items()"
    [optionsLoading]="optionsLoading()"
    (save)="save($event)"
  />
  @if (record(); as owner) {
    <app-image-gallery
      ownerType="route"
      [ownerId]="owner._id"
      [ownerLabel]="heading()"
      (coverChange)="refreshCover()"
    />
  }
</ui-form-page>
