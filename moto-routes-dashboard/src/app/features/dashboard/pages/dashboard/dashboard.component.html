<ui-page-header title="Dashboard" [subtitle]="subtitle()">
  <button type="button" class="btn btn--secondary" [disabled]="store.loading()" (click)="reload()">
    <ui-icon name="arrows-clockwise" />Actualizar
  </button>
  <a class="btn btn--primary" routerLink="/departures/new"><ui-icon name="plus" />Nueva salida</a>
</ui-page-header>

@if (loadFailed(); as error) {
  <div class="card">
    <ui-error-state title="No se han podido cargar los datos del Dashboard" [error]="error" (retry)="reload()" />
  </div>
} @else if (showSkeleton()) {
  <!-- misma forma que el contenido final -->
  <div aria-busy="true" aria-label="Cargando el Dashboard">
    <ui-skeleton class="skeleton-hero" height="104px" />
    <div class="cols">
      <ui-skeleton height="320px" />
      <ui-skeleton height="320px" />
    </div>
  </div>
} @else if (store.total() === 0) {
  <div class="card">
    <ui-empty-state
      icon="path"
      title="Todavía no hay rutas"
      description="Cuando crees la primera, aquí verás las cifras del catálogo y de las salidas."
    >
      <a class="btn btn--primary" routerLink="/routes/new"><ui-icon name="plus" />Nueva ruta</a>
    </ui-empty-state>
  </div>
} @else {
  <app-dashboard-hero [departure]="nextDeparture()" [loadedAt]="store.loadedAt()" />

  <div class="cols">
    <app-dashboard-agenda
      [departures]="store.nextDepartures()"
      [routes]="store.recent()"
      [loadedAt]="store.loadedAt()"
    />
    <app-dashboard-catalog
      [stats]="stats()"
      [byDifficulty]="store.byDifficulty()"
      [byCategory]="store.byCategory()"
      [otherCategories]="store.otherCategories()"
      [months]="months()"
    />
  </div>
}
